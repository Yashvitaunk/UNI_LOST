<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard | UNI_LOST</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --secondary-color: #1d4ed8;
      --bg-color: #f0f4f8;
      --text-color: #333;
      --card-bg: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      min-height: 100vh;
      transition: 0.3s;
    }

    /* --- Top Header --- */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 30px;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.1);
      z-index: 15;
      height: 60px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      padding: 6px 10px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      z-index: 20;
      gap: 4px;
    }

    .hamburger span {
      width: 20px;
      height: 3px;
      background: white;
      transition: 0.3s;
      border-radius: 2px;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(7px, -7px);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 6px 10px;
      background: #f0f4f8;
      border-radius: 8px;
      transition: 0.3s;
      border: none;
    }

    .profile-header:hover {
      background: #e0e7ff;
    }

    .profile-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
    }

    .profile-info {
      display: none;
    }

    /* Profile Dropdown Menu */
    .profile-dropdown {
      position: absolute;
      top: 50px;
      right: 0;
      background: white;
      border: 2px solid #e0e7ff;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      min-width: 150px;
      z-index: 25;
      display: none;
    }

    .profile-dropdown.active {
      display: block;
    }

    .profile-dropdown a,
    .profile-dropdown button {
      display: block;
      width: 100%;
      padding: 12px 15px;
      border: none;
      background: none;
      text-decoration: none;
      color: var(--text-color);
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      transition: 0.3s;
      font-family: 'Poppins', sans-serif;
    }

    .profile-dropdown a:hover,
    .profile-dropdown button:hover {
      background: #f0f4f8;
      color: var(--primary-color);
    }

    .profile-dropdown a {
      border-bottom: 1px solid #e0e7ff;
    }

    .profile-dropdown button {
      color: #ef4444;
      font-weight: 600;
    }

    .profile-dropdown button:hover {
      background: #fef2f2;
      color: #dc2626;
    }

    /* --- Sidebar Navigation --- */
    .sidebar {
      position: fixed;
      width: 250px;
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      color: white;
      padding: 80px 20px 20px 20px;
      box-shadow: 2px 0 15px rgba(37, 99, 235, 0.2);
      display: flex;
      flex-direction: column;
      z-index: 10;
      transition: 0.3s ease;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
    }

    .sidebar.hidden {
      transform: translateX(-100%);
    }

    .sidebar-logo {
      text-align: center;
      padding-bottom: 15px;
      margin-bottom: 15px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    .sidebar-logo h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .nav-list {
      list-style: none;
      padding: 0;
      margin: 0;
      flex-grow: 1;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      padding: 14px 14px;
      color: white;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s;
      border-left: 4px solid transparent;
      margin: 5px 0;
      border-radius: 8px;
    }

    .nav-item a:hover,
    .nav-item a.active {
      background: rgba(255, 255, 255, 0.2);
      border-left-color: white;
      transform: translateX(5px);
    }

    .logout-btn {
      padding: 0;
      margin-top: auto;
      display: none;
    }

    .logout-btn a {
      display: block;
      text-align: center;
      padding: 11px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
      transition: 0.3s;
    }

    .logout-btn a:hover {
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
      transform: translateY(-2px);
    }

    /* --- Main Content Area --- */
    .main-content {
      flex-grow: 1;
      margin-left: 250px;
      margin-top: 60px;
      padding: 25px;
      overflow-y: auto;
      transition: 0.3s ease;
    }

    .main-content.sidebar-hidden {
      margin-left: 0;
    }

    .content-section {
      display: none;
      background: transparent;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .content-section.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Grid Layout --- */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      align-items: start;
    }

    .card {
      background: #fff;
      border: 2px solid #e0e7ff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .card:hover {
      border-color: #2563eb;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.2);
      transform: translateY(-5px);
    }

    .card-tag {
      padding: 8px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: 0.3s ease;
      cursor: pointer;
    }

    .tag-found {
      background: linear-gradient(135deg, #6ee7b7 0%, #34d399 100%);
    }

    .tag-found:hover {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: inset 0 0 12px rgba(16, 185, 129, 0.3);
    }

    .tag-lost {
      background: linear-gradient(135deg, #fca5a5 0%, #f87171 100%);
    }

    .tag-lost:hover {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: inset 0 0 12px rgba(239, 68, 68, 0.3);
    }

    .card-body {
      padding: 15px;
      text-align: left;
      flex-grow: 1;
    }

    .card-body h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #1e293b;
      font-weight: 600;
    }

    .card-body p {
      margin: 5px 0;
      font-size: 13px;
      color: #666;
    }

    .item-card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 1px solid #eee;
    }

    .btn-claim {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      width: 100%;
      transition: 0.3s ease;
    }

    .btn-claim:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      transform: scale(1.05);
    }

    .btn-claim:active {
      transform: scale(0.98);
    }

    /* --- Forms --- */
    .report-form label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      font-size: 14px;
      color: var(--primary-color);
    }

    .report-form input,
    .report-form textarea,
    .report-form select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 2px solid #e0e7ff;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      transition: 0.3s;
      font-size: 14px;
    }

    .report-form input:hover,
    .report-form textarea:hover,
    .report-form select:hover {
      border-color: #bfdbfe;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
    }

    .report-form input:focus,
    .report-form textarea:focus,
    .report-form select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
      background: #f0f9ff;
    }

    .btn-submit {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 14px;
      margin-top: 25px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-submit:hover {
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      transform: translateY(-2px);
    }

    /* Notifications */
    .notif-card {
      border-left: 5px solid var(--primary-color);
      background: #f0f9ff;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.1);
      transition: 0.3s;
      cursor: pointer;
    }

    .notif-card:hover {
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.2);
      transform: translateX(5px);
      background: #e0f2fe;
    }

    .notif-status {
      font-weight: bold;
      text-transform: uppercase;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-approved {
      background: #dcfce7;
      color: #166534;
    }

    .search-bar {
      margin-bottom: 25px;
      display: flex;
      gap: 10px;
    }

    .search-bar input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e7ff;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.3s;
    }

    .search-bar input:hover {
      border-color: #bfdbfe;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
    }

    .search-bar input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
      background: #f0f9ff;
    }

    .search-bar button {
      padding: 12px 25px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      font-size: 14px;
      white-space: nowrap;
    }

    .search-bar button:hover {
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      transform: translateY(-2px);
    }

    h1 {
      color: var(--primary-color);
      font-size: 28px;
      margin: 0 0 20px 0;
      font-weight: 700;
    }

    h2 {
      color: var(--primary-color);
      font-size: 24px;
      margin: 0 0 20px 0;
      font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hamburger {
        display: flex;
      }

      .top-header {
        padding: 10px 20px;
      }

      .logo-text {
        font-size: 16px;
      }

      .profile-info {
        display: none;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .sidebar {
        position: fixed;
        height: 100vh;
        left: 0;
        top: 0;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Top Header -->
  <div class="top-header">
    <div class="header-left">
      <button class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="logo-text">UNI_LOST</div>
    </div>
    <div class="header-right">
      <button class="profile-header" id="profileHeader">
        <div class="profile-icon">👤</div>
      </button>
      <div class="profile-dropdown" id="profileDropdown">
        <a href="#" onclick="goToProfile(event)">👥 Profile</a>
        <button onclick="handleLogout()">🚪 Logout</button>
      </div>
    </div>
  </div>

  <!-- Sidebar Navigation -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <h2>UNI_LOST</h2>
    </div>

    <ul class="nav-list">
      <li class="nav-item"><a id="reportLostLink">✗ Report Lost Item</a></li>
      <li class="nav-item"><a id="reportFoundLink">✓ Report Found Item</a></li>
      <li class="nav-item"><a id="searchLink">🔍 Search Items</a></li>
      <li class="nav-item"><a id="notifLink">🔔 Notifications</a></li>
    </ul>
    <div class="logout-btn"><a href="index.html">🚪 Logout</a></div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <div id="searchSection" class="content-section">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search items by name...">
        <button type="button" id="searchBtn" onclick="fetchItems()">Search</button>
      </div>
      <div class="cards" id="itemsGrid"></div>
    </div>

    <div id="notifSection" class="content-section">
      <h2>My Notifications</h2>
      <div id="notifList">Loading notifications...</div>
    </div>

    <div id="reportFoundSection" class="content-section">
      <h2>Report a Found Item</h2>
      <form class="report-form" id="foundForm">
        <label>Item Name</label>
        <input type="text" id="fName" required>
        <label>Category</label>
        <select id="fCategory">
          <option value="Electronics">Electronics</option>
          <option value="Documents">Documents</option>
          <option value="Accessories">Accessories</option>
        </select>
        <label>Location Found</label>
        <input type="text" id="fLocation" required>
        <label>Upload Image</label>
        <input type="file" id="fImage" accept="image/*">
        <label>Description</label>
        <textarea id="fDesc" rows="3"></textarea>
        <button type="button" class="btn-submit" id="btnFound" onclick="submitItem('found')">Submit Found Report</button>
      </form>
    </div>

    <div id="reportLostSection" class="content-section">
      <h2>Report a Lost Item</h2>
      <form class="report-form" id="lostForm">
        <label>Item Name</label>
        <input type="text" id="lName" required>
        <label>Category</label>
        <select id="lCategory">
          <option value="ID/Cards">ID/Cards</option>
          <option value="Electronics">Electronics</option>
        </select>
        <label>Last Seen Location</label>
        <input type="text" id="lLocation" required>
        <label>Upload Image</label>
        <input type="file" id="lImage" accept="image/*">
        <label>Contact Information</label>
        <input type="text" id="lContact" required>
        <button type="button" class="btn-submit" id="btnLost" onclick="submitItem('lost')">Submit Lost Report</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'https://uni-lost-backend.onrender.com/api';
    const USER_REG = '23fe10cse00634';
    let isSubmitting = false;

    // Hamburger Menu Toggle
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      sidebar.classList.toggle('hidden');
      mainContent.classList.toggle('sidebar-hidden');
    });

    // Profile Dropdown Toggle
    const profileHeader = document.getElementById('profileHeader');
    const profileDropdown = document.getElementById('profileDropdown');

    profileHeader.addEventListener('click', () => {
      profileDropdown.classList.toggle('active');
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!profileHeader.contains(e.target) && !profileDropdown.contains(e.target)) {
        profileDropdown.classList.remove('active');
      }
    });

    // Handle Logout
    function handleLogout() {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.clear();
        window.location.href = 'index.html';
      }
    }

    // Go to Profile
    function goToProfile(event) {
      event.preventDefault();
      window.location.href = 'profile.html';
    }

    function switchContent(sectionId) {
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-list a').forEach(a => a.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      const linkId = sectionId.replace('Section', 'Link');
      if (document.getElementById(linkId)) document.getElementById(linkId).classList.add('active');

      if (sectionId === 'notifSection') fetchNotifications();
    }

    document.getElementById('reportLostLink').addEventListener('click', () => switchContent('reportLostSection'));
    document.getElementById('reportFoundLink').addEventListener('click', () => switchContent('reportFoundSection'));
    document.getElementById('searchLink').addEventListener('click', () => switchContent('searchSection'));
    document.getElementById('notifLink').addEventListener('click', () => switchContent('notifSection'));

    function convertToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function submitItem(type) {
      if (isSubmitting) return;
      const nameInput = document.getElementById(type === 'found' ? 'fName' : 'lName');
      const fileInput = document.getElementById(type === 'found' ? 'fImage' : 'lImage');

      if (!nameInput.value) return alert("Please enter item name.");

      isSubmitting = true;
      const btn = document.getElementById(type === 'found' ? 'btnFound' : 'btnLost');
      btn.innerText = "Processing...";

      try {
        let imageBase64 = "";
        if (fileInput.files.length > 0) {
          imageBase64 = await convertToBase64(fileInput.files[0]);
        }

        const data = {
          name: nameInput.value,
          category: document.getElementById(type === 'found' ? 'fCategory' : 'lCategory').value,
          location: document.getElementById(type === 'found' ? 'fLocation' : 'lLocation').value,
          itemType: type
        };

        const res = await fetch(`${API_BASE}/items`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          const result = await res.json();
          if (imageBase64) {
            localStorage.setItem(`img_${result._id}`, imageBase64);
          }
          alert('✅ Successfully saved to MongoDB!');
          switchContent('searchSection');
        }
      } catch (err) { alert('❌ Connection error.'); }
      finally { isSubmitting = false; btn.innerText = type === 'found' ? "Submit Found Report" : "Submit Lost Report"; }
    }

    async function fetchItems() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '<p style="text-align: center; padding: 20px;">Loading items...</p>';
      try {
        const res = await fetch(`${API_BASE}/items`);
        const items = await res.json();
        grid.innerHTML = '';

        // Filter only FOUND items
        const foundItems = items.filter(item => item.itemType === 'found');

        foundItems.forEach(item => {
          const localImg = localStorage.getItem(`img_${item._id}`);
          const tagClass = item.itemType === 'found' ? 'tag-found' : 'tag-lost';
          const imgHtml = localImg ? `<img src="${localImg}" class="item-card-img">` : '';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-tag ${tagClass}">${item.itemType.toUpperCase()}</div>
            ${imgHtml}
            <div class="card-body">
              <h3>${item.name}</h3>
              <p><b>Location:</b> ${item.location}</p>
              <button class="btn-claim" type="button" onclick="claimItem('${item._id}', '${item.name}')">Claim This Item</button>
            </div>
          `;
          grid.appendChild(card);
        });

        if (foundItems.length === 0) {
          grid.innerHTML = '<p style="text-align: center; padding: 20px;">No found items available</p>';
        }
      } catch (err) { grid.innerHTML = '<p style="text-align: center; padding: 20px;">Error loading items.</p>'; }
    }

    function claimItem(itemId, itemName) {
      if (!confirm(`Claim "${itemName}"?`)) return;
      const dummyClaim = { _id: 'd_' + Date.now(), item: { name: itemName }, status: 'pending', createdAt: new Date() };
      let localClaims = JSON.parse(localStorage.getItem('myClaims') || '[]');
      localClaims.push(dummyClaim);
      localStorage.setItem('myClaims', JSON.stringify(localClaims));
      alert('🚀 Claim submitted!');
      fetchNotifications();

      setTimeout(() => {
        let updated = JSON.parse(localStorage.getItem('myClaims') || '[]');
        let target = updated.find(c => c._id === dummyClaim._id);
        if (target) {
          target.status = 'approved';
          localStorage.setItem('myClaims', JSON.stringify(updated));
          fetchNotifications();
        }
      }, 10000);
    }

    function fetchNotifications() {
      const list = document.getElementById('notifList');
      const localClaims = JSON.parse(localStorage.getItem('myClaims') || '[]');
      if (localClaims.length === 0) { list.innerHTML = '<p>No claims yet.</p>'; return; }
      list.innerHTML = localClaims.map(c => `
        <div class="notif-card">
          <span class="notif-status status-${c.status}">${c.status}</span>
          <h3>Item: ${c.item.name}</h3>
          <p><b>Status:</b> ${c.status === 'approved' ? 'Verified! Collect from Fire Control Room desk.' : 'Awaiting review (PBL Demo Mode)...'}</p>
        </div>
      `).reverse().join('');
    }

    window.onload = () => { 
      // Do nothing - no auto-fetch
    };
  </script>
</body>

</html>
